server:
  port: ${SERVER_PORT:8087}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: ledgerline-ai-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_java}
    username: ${DB_USER:ledgerline_ai_readonly}
    password: ${DB_PASSWORD:ledgerline_readonly}
    hikari:
      read-only: true
ledger:
  redaction-policy: ${REDACTION_POLICY:classpath:redaction.yaml}
