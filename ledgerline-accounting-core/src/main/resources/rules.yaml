rules:
  - match: {category: seller_payout, country: US}
    debit: {gl_account: "2100", cost_center: CC-PAYOUT-US}
    credit: {gl_account: "4000", cost_center: CC-REVENUE-US}
    fee_credit: {gl_account: "4900", cost_center: CC-FEES-US}
  - match: {category: seller_payout}
    debit: {gl_account: "2100", cost_center: CC-PAYOUT-INTL}
    credit: {gl_account: "4000", cost_center: CC-REVENUE-INTL}
    fee_credit: {gl_account: "4900", cost_center: CC-FEES-INTL}
  - match: {category: refund}
    debit: {gl_account: "4000", cost_center: CC-REVENUE}
    credit: {gl_account: "2100", cost_center: CC-PAYOUT}
  - match: {category: "*", country: "*"}
    debit: {gl_account: "9999", cost_center: CC-UNCLASSIFIED}
    credit: {gl_account: "9999", cost_center: CC-UNCLASSIFIED}
